name: G1.3 independent quantized pipeline
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/quantized_pipeline_g13/**'
      - '.github/workflows/quantized-pipeline-g13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: FeSens/openTPU
          ref: d84db55712aba0d40811d7762cb052f05d55b7e5
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'numpy==2.2.6' 'pytest==8.4.2'
          python -m pip install -e upstream
          test "$(git -C upstream rev-parse HEAD)" = d84db55712aba0d40811d7762cb052f05d55b7e5
      - working-directory: project
        run: |
          python experiments/quantized_pipeline_g13/verify_pipeline.py
          python -m unittest discover -s experiments/quantized_pipeline_g13 -p 'test_memory_model.py' -v
          python experiments/quantized_pipeline_g13/memory_model.py | tee g13-memory-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g13-evidence
          path: |
            project/g13-results.json
            project/g13-memory-results.json
          if-no-files-found: warn
