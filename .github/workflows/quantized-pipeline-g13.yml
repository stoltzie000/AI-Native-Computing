name: G1.3 independent quantized pipeline
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/quantized_pipeline_g13/**'
      - '.github/workflows/quantized-pipeline-g13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: FeSens/openTPU
          ref: d84db55712aba0d40811d7762cb052f05d55b7e5
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'numpy==2.2.6' 'pytest==8.4.2'
          python -m pip install -e upstream
          test "$(git -C upstream rev-parse HEAD)" = d84db55712aba0d40811d7762cb052f05d55b7e5
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - working-directory: project
        run: |
          set -euo pipefail
          python experiments/quantized_pipeline_g13/verify_pipeline.py
          python -m unittest discover -s experiments/quantized_pipeline_g13 -p 'test_memory_model.py' -v
          python experiments/quantized_pipeline_g13/memory_model.py | tee g13-memory-results.json
          python -m unittest discover -s experiments/quantized_pipeline_g13 -p 'test_memory_pipeline.py' -v
          python experiments/quantized_mxu_g12/adapter.py --output g13-fixtures
          iverilog -g2012 -Wall -s tb_mxu_memory_wrapper -o /tmp/g13.vvp experiments/quantized_mxu_g12/rtl/exact_mxu_int8_core.v experiments/quantized_pipeline_g13/rtl/mxu_memory_wrapper.v experiments/quantized_pipeline_g13/rtl/tb_mxu_memory_wrapper.sv
          for dir in g13-fixtures/case_*; do
            for mode in 0 1; do
              vvp /tmp/g13.vvp "+case=$dir" "+mode=$mode" | tee -a g13-rtl.log
            done
          done
          test "$(grep -c '^PASS_MEMORY_RTL' g13-rtl.log)" -eq 48
          # Keep the 48-case baseline and add independent protocol stress.
          iverilog -g2012 -Wall -s tb_mxu_memory_protocol -o /tmp/g13-protocol.vvp \
            experiments/quantized_mxu_g12/rtl/exact_mxu_int8_core.v \
            experiments/quantized_pipeline_g13/rtl/mxu_memory_wrapper.v \
            experiments/quantized_pipeline_g13/rtl/tb_mxu_memory_protocol.sv
          mapfile -t cases < <(find g13-fixtures -maxdepth 1 -type d -name 'case_*' | sort)
          test "${#cases[@]}" -eq 24
          : > g13-protocol.log
          for idx in 0 6 12 18; do
            other=$(((idx+11)%24))
            vvp /tmp/g13-protocol.vvp "+case_a=${cases[idx]}" \
              "+case_b=${cases[other]}" "+seed=$((20261124+idx))" | tee -a g13-protocol.log
          done
          test "$(grep -c '^PASS_RESET' g13-protocol.log)" -eq 12
          test "$(grep -c '^PASS_PROTOCOL_STRESS' g13-protocol.log)" -eq 8
          test "$(grep -c '^PASS_PROTOCOL_SUITE' g13-protocol.log)" -eq 4
          G13_FIXTURE_ROOT=g13-fixtures python -m unittest discover -s experiments/quantized_pipeline_g13 -p 'test_burst_reference.py' -v | tee g13-burst-reference.log
          test "$(grep -c '^PASS_SYNTHETIC_COMPARATOR' g13-burst-reference.log)" -eq 1
          # Tagged burst RTL: independent out-of-order responder and flush.
          iverilog -g2012 -Wall -s tb_mxu_tagged_burst -o /tmp/g13-tagged.vvp \
            experiments/quantized_mxu_g12/rtl/exact_mxu_int8_core.v \
            experiments/quantized_pipeline_g13/rtl/mxu_tagged_burst_wrapper.v \
            experiments/quantized_pipeline_g13/rtl/tb_mxu_tagged_burst.sv
          : > g13-tagged-rtl.log
          for idx in 0 6 12 18; do
            other=$(((idx+11)%24))
            vvp /tmp/g13-tagged.vvp "+case_a=${cases[idx]}" \
              "+case_b=${cases[other]}" "+seed=$((20261124+idx))" | tee -a g13-tagged-rtl.log
          done
          test "$(grep -c '^PASS_TAGGED_FLUSH' g13-tagged-rtl.log)" -eq 4
          test "$(grep -c '^PASS_TAGGED_BURST_RTL' g13-tagged-rtl.log)" -eq 8
          test "$(grep -c '^PASS_TAGGED_SUITE' g13-tagged-rtl.log)" -eq 4
          # Adversarial response-tag and reset-domain fault protocol.
          iverilog -g2012 -Wall -s tb_mxu_tagged_burst_fault -o /tmp/g13-fault.vvp \
            experiments/quantized_mxu_g12/rtl/exact_mxu_int8_core.v \
            experiments/quantized_pipeline_g13/rtl/mxu_tagged_burst_wrapper.v \
            experiments/quantized_pipeline_g13/rtl/tb_mxu_tagged_burst_fault.sv
          vvp /tmp/g13-fault.vvp | tee g13-tagged-fault.log
          test "$(grep -c '^PASS_TAGGED_INVALID_TAG' g13-tagged-fault.log)" -eq 1
          test "$(grep -c '^PASS_TAGGED_DUPLICATE_TAG' g13-tagged-fault.log)" -eq 1
          test "$(grep -c '^PASS_TAGGED_FAULT_SUITE' g13-tagged-fault.log)" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g13-evidence
          path: |
            project/g13-results.json
            project/g13-memory-results.json
            project/g13-memory-pipeline.json
            project/g13-rtl.log
            project/g13-protocol.log
            project/g13-burst-reference.log
            project/g13-tagged-rtl.log
            project/g13-tagged-fault.log
          if-no-files-found: warn

  synthesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install generic open-source synthesis toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys
          yosys -V
      - name: Run same-flow generic Yosys synthesis for both loader variants
        run: |
          set -euo pipefail
          yosys -Q -T -p 'read_verilog -sv -DSYNTHESIS experiments/quantized_mxu_g12/rtl/exact_mxu_int8_core.v experiments/quantized_pipeline_g13/rtl/mxu_memory_wrapper.v; synth -top mxu_memory_wrapper; stat' | tee g13-yosys-byte.log
          yosys -Q -T -p 'read_verilog -sv -DSYNTHESIS experiments/quantized_mxu_g12/rtl/exact_mxu_int8_core.v experiments/quantized_pipeline_g13/rtl/mxu_tagged_burst_wrapper.v; synth -top mxu_tagged_burst_wrapper; stat' | tee g13-yosys-tagged.log
          grep -q 'Number of cells:' g13-yosys-byte.log
          grep -q 'Number of cells:' g13-yosys-tagged.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g13-generic-synthesis
          path: |
            g13-yosys-byte.log
            g13-yosys-tagged.log
          if-no-files-found: warn
