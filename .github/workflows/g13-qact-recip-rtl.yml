name: G1.3 pinned external reciprocal RTL baseline
on:
  push:
    branches: [research/g13-qact-offset]
    paths:
      - '.github/workflows/g13-qact-recip-rtl.yml'
      - 'experiments/g13_qact_offset/rtl/qact_recip_pinned_ref.sv'
      - 'experiments/g13_qact_offset/rtl/tb_qact_recip_ref.sv'
      - 'experiments/g13_qact_offset/rtl/qact_row_full_pinned.sv'
      - 'experiments/g13_qact_offset/rtl/tb_qact_row_full_pinned.sv'
      - 'experiments/g13_qact_offset/qact_full_reference.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-reciprocal:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: FeSens/openTPU
          ref: d84db55712aba0d40811d7762cb052f05d55b7e5
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: verilator/verilator
          ref: bbb60a403932a9f695cb6ff001ceb73de6ad9234
          path: verilator-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build pinned Verilator 5.054
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex libfl-dev help2man make g++ perl
          test "$(git -C verilator-src rev-parse HEAD)" = bbb60a403932a9f695cb6ff001ceb73de6ad9234
          (cd verilator-src && autoconf && ./configure --prefix="$RUNNER_TEMP/verilator-pinned" && make -j 2 && make install)
          echo "$RUNNER_TEMP/verilator-pinned/bin" >> "$GITHUB_PATH"
      - name: Generate independently verified reciprocal fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.2.6'
          test "$(git -C upstream rev-parse HEAD)" = d84db55712aba0d40811d7762cb052f05d55b7e5
          python project/experiments/g13_qact_offset/recip_software_differential.py --upstream upstream --out recip-fixtures | tee recip-software-reference.log
          grep -q '^PASS_RECIP_SOFTWARE_DIFFERENTIAL vectors=2048' recip-software-reference.log
      - name: Run pinned unmodified arithmetic package through RTL
        shell: bash
        run: |
          set -euo pipefail
          verilator --version | tee verilator-version.log
          verilator --binary --timing -j 2 -Wno-fatal --top-module tb_qact_recip_ref --Mdir "$RUNNER_TEMP/obj-recip" upstream/rtl/vpu/otpu_fp.sv project/experiments/g13_qact_offset/rtl/qact_recip_pinned_ref.sv project/experiments/g13_qact_offset/rtl/tb_qact_recip_ref.sv
          "$RUNNER_TEMP/obj-recip/Vtb_qact_recip_ref" +folder=recip-fixtures | tee recip-rtl-reference.log
          grep -q '^PASS_PINNED_RECIP_RTL vectors=2048' recip-rtl-reference.log
      - name: Full QACT mathematical RTL using pinned reciprocal
        shell: bash
        run: |
          set -euo pipefail
          python project/experiments/g13_qact_offset/qact_full_reference.py --upstream upstream --out qact-full-fixtures | tee qact-full-reference.log
          grep -q '^PASS_QACT_FULL_REFERENCE rows=32 q=2048 offsets=256 scales=32' qact-full-reference.log
          verilator --binary --timing -j 2 -Wno-fatal --top-module tb_qact_row_full_pinned --Mdir "$RUNNER_TEMP/obj-qact-full" \
            upstream/rtl/vpu/otpu_fp.sv \
            project/experiments/g13_fp32_epilogue/rtl/fp32_mul_ftz.v \
            project/experiments/g13_qact_offset/rtl/qact_q8_rne.v \
            project/experiments/g13_qact_offset/rtl/qact_group_offset_hier.v \
            project/experiments/g13_qact_offset/rtl/qact_row_scaled_parallel.v \
            project/experiments/g13_qact_offset/rtl/qact_row_full_pinned.sv \
            project/experiments/g13_qact_offset/rtl/tb_qact_row_full_pinned.sv
          "$RUNNER_TEMP/obj-qact-full/Vtb_qact_row_full_pinned" +folder=qact-full-fixtures | tee qact-full-rtl.log
          grep -q '^PASS_FULL_QACT_PINNED_RTL rows=32 q=2048 offsets=256 scales=32 inverses=32' qact-full-rtl.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-reciprocal-rtl-evidence
          path: |
            qact-full-reference.log
            qact-full-rtl.log
            qact-full-fixtures/full-manifest.json
            recip-software-reference.log
            recip-rtl-reference.log
            verilator-version.log
            recip-fixtures/recip-manifest.json
          if-no-files-found: warn
