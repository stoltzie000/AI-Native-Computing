name: Simulator v0.3 regression and reproducibility

on:
  push:
    paths:
      - "simulator_v0_3/**"
      - ".github/workflows/simulator-v0-3-tests.yml"
  pull_request:
    paths:
      - "simulator_v0_3/**"
      - ".github/workflows/simulator-v0-3-tests.yml"

permissions:
  contents: read

jobs:
  unit-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate simulator and functional microkernel
        run: python -m unittest discover -s simulator_v0_3 -p "test_*.py" -v
      - name: Deterministic experiment output must match repository
        run: python simulator_v0_3/run_experiments.py | cmp - simulator_v0_3/results/summary.json
