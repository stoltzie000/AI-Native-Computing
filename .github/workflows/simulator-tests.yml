name: AI-Native Simulator Regression

on:
  push:
    paths:
      - "simulator_v0_2/**"
      - ".github/workflows/simulator-tests.yml"
  pull_request:
    paths:
      - "simulator_v0_2/**"
      - ".github/workflows/simulator-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit and constraint tests
        run: python -m unittest discover -s simulator_v0_2 -p "test_*.py" -v
      - name: Reproduce JSON experiment report
        run: python simulator_v0_2/run_experiments.py > simulator_v0_2/results/summary.json
      - name: Check deterministic output matches tracked baseline
        run: git diff --exit-code -- simulator_v0_2/results/summary.json
