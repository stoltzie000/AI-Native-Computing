name: G1.2 pinned quantized MM core correctness

on:
  push:
    branches:
      - research/quantized-mxu-g12
    paths:
      - '.github/workflows/quantized-mxu-g12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quantify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Checkout pinned external openTPU reference
        uses: actions/checkout@v4
        with:
          repository: FeSens/openTPU
          ref: d84db55712aba0d40811d7762cb052f05d55b7e5
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and Icarus toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog
          python -m pip install 'numpy==2.2.6' 'pytest==8.4.2'
          python -m pip install -e upstream
          mkdir -p project/experiments/quantized_mxu_g12/results/generated
          python -m pip freeze > project/experiments/quantized_mxu_g12/results/python_dependencies.txt
          iverilog -V > project/experiments/quantized_mxu_g12/results/iverilog_version.txt 2>&1
          test "$(git -C upstream rev-parse HEAD)" = 'd84db55712aba0d40811d7762cb052f05d55b7e5'
      - name: Verify exact source payload before executing anything
        working-directory: project
        run: |
          set -euo pipefail
          printf 'edd1cb8ff9f0193900f670c13aa8427a2550c5204ce1ca280c0ff8ef765176d7  experiments/quantized_mxu_g12/exact_core.py\n' | sha256sum -c -
      - name: Run our independent integer oracle tests
        working-directory: project
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/quantized_mxu_g12/tests -p 'test_*.py' -v
      - name: Run actual upstream directed quantized MM control
        working-directory: upstream
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_isa.py::test_mm_matches_integer_math \
            --junitxml=../project/experiments/quantized_mxu_g12/results/upstream_mm_control.xml
      - name: Independently calculate exact integer core and compare actual ISA FP32 bits
        working-directory: project
        run: |
          set -euo pipefail
          python experiments/quantized_mxu_g12/adapter.py \
            --output experiments/quantized_mxu_g12/results/generated | tee \
            experiments/quantized_mxu_g12/results/adapter.log
          grep -F 'PASS_QUANTIZED_MXU_ISA fixtures=8 activation_rows=24' \
            experiments/quantized_mxu_g12/results/adapter.log
      - name: Run separate quantized integer core RTL against exactly those input bytes
        working-directory: project
        run: |
          set -euo pipefail
          base='experiments/quantized_mxu_g12'
          mkdir -p "$base/results/rtl"
          iverilog -g2012 -Wall -s tb_exact_mxu_int8_core -o "$base/results/rtl/exact_core.vvp" \
            "$base/rtl/exact_mxu_int8_core.v" "$base/rtl/tb_exact_mxu_int8_core.sv"
          count=0
          for dir in "$base"/results/generated/case_*_activation_*; do
            vvp "$base/results/rtl/exact_core.vvp" "+case=$dir" | tee -a "$base/results/rtl/rtl.log"
            count=$((count+1))
          done
          test "$count" -eq 24
          test "$(grep -c '^PASS_QMM_CORE' "$base/results/rtl/rtl.log")" -eq 24
      - name: Keep CI provenance and all test artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantized-mxu-g12-evidence
          path: project/experiments/quantized_mxu_g12/results/
          if-no-files-found: warn
          retention-days: 30
