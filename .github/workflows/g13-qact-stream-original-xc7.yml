name: G1.3 original 76-byte QACT stream XC7 synthesis
on:
  push:
    branches: [research/g13-qact-offset]
    paths:
      - '.github/workflows/g13-qact-stream-original-xc7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xc7-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and capture Yosys toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys
          yosys -V | tee original-stream-yosys-version.log
      - name: Map original reciprocal and 76-byte QACT wrapper to XC7
        shell: bash
        run: |
          set -euo pipefail
          src=experiments/g13_qact_offset/rtl
          timeout 600s yosys -Q -T -p "read_verilog -sv -DSYNTHESIS experiments/g13_fp32_epilogue/rtl/fp32_mul_ftz.v $src/fp32_addsub_ftz.v $src/qact_q8_rne.v $src/qact_group_offset_hier.v $src/qact_row_scaled_serial.v $src/qact_recip_serial_original_arith.v $src/qact_row_clocked_original.v $src/qact_row_stream_original.v; synth_xilinx -family xc7 -top qact_row_stream_original; stat" | tee original-stream-xc7.log
          grep -q 'Number of cells:' original-stream-xc7.log
          grep -q 'IBUF' original-stream-xc7.log
          grep -q 'OBUF' original-stream-xc7.log
          echo PASS_QACT_ORIGINAL_STREAM_XC7_MAPPING
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-stream-xc7-evidence
          path: |
            original-stream-yosys-version.log
            original-stream-xc7.log
          if-no-files-found: warn
