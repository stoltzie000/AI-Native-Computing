name: G1.3 shared FP32 epilogue bit-exact and generic synthesis
on:
  push:
    branches: [research/g13-fp32-epilogue]
    paths:
      - '.github/workflows/g13-fp32-serial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  serial-epilogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: FeSens/openTPU
          ref: d84db55712aba0d40811d7762cb052f05d55b7e5
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate pinned ISA fixtures and run bit-exact serial RTL
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6
          python -m pip install -e ../upstream
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          test "$(git -C ../upstream rev-parse HEAD)" = d84db55712aba0d40811d7762cb052f05d55b7e5
          python experiments/quantized_mxu_g12/adapter.py --output serial-fixtures
          base=experiments/g13_fp32_epilogue/rtl
          iverilog -g2012 -Wall -s tb_mxu_integer_epilogue_serial -o /tmp/serial.vvp "$base/fp32_mul_ftz.v" "$base/int48_to_fp32_rne.v" "$base/mxu_integer_epilogue_serial.v" "$base/tb_mxu_integer_epilogue_serial.sv"
          mapfile -t cases < <(find serial-fixtures -maxdepth 1 -type d -name 'case_*' | sort)
          test "${#cases[@]}" -eq 24
          : > serial-rtl.log
          for idx in $(seq 0 23); do
            other=$(((idx+11)%24))
            vvp /tmp/serial.vvp "+case_a=${cases[idx]}" "+case_b=${cases[other]}" | tee -a serial-rtl.log
          done
          test "$(grep -c '^PASS_SERIAL_EPILOGUE job=' serial-rtl.log)" -eq 48
          test "$(grep -c '^PASS_SERIAL_EPILOGUE_SUITE' serial-rtl.log)" -eq 24
          yosys -V | tee yosys-version.log
          timeout 420s yosys -Q -T -p "read_verilog -sv -DSYNTHESIS $base/fp32_mul_ftz.v $base/int48_to_fp32_rne.v $base/mxu_integer_epilogue_serial.v; synth -top mxu_integer_epilogue_serial; stat" | tee serial-synth.log
          grep -q 'Number of cells:' serial-synth.log
          echo PASS_SERIAL_EPILOGUE_GENERIC_SYNTH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g13-shared-epilogue-evidence
          path: |
            project/serial-rtl.log
            project/serial-synth.log
            project/yosys-version.log
          if-no-files-found: warn
