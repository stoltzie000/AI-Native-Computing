name: G1.3 narrow streaming QACT numerical and protocol regression
on:
  push:
    branches: [research/g13-qact-offset]
    paths:
      - '.github/workflows/g13-qact-stream.yml'
      - 'experiments/g13_qact_offset/rtl/qact_row_stream_wrapper.v'
      - 'experiments/g13_qact_offset/rtl/tb_qact_row_stream.sv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  streaming:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: FeSens/openTPU
          ref: d84db55712aba0d40811d7762cb052f05d55b7e5
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate independent ISA-backed row fixtures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog
          python -m pip install 'numpy==2.2.6'
          test "$(git -C upstream rev-parse HEAD)" = d84db55712aba0d40811d7762cb052f05d55b7e5
          python experiments/g13_qact_offset/qact_row_reference.py --upstream upstream --out qact-stream-fixtures | tee qact-stream-reference.log
          grep -q '^PASS_QACT_ROW_REFERENCE rows=32 q=2048 offsets=256 sha256=063c8a796f98083a68d875a588491dcf39166f0d2dca665e63a2f5cde65ecba9' qact-stream-reference.log
      - name: Exercise ready valid QACT stream under backpressure
        shell: bash
        run: |
          set -euo pipefail
          src=experiments/g13_qact_offset/rtl
          iverilog -g2012 -Wall -s tb_qact_row_stream -o /tmp/qact-stream.vvp \
            experiments/g13_fp32_epilogue/rtl/fp32_mul_ftz.v \
            $src/qact_group_offset_hier.v $src/qact_q8_rne.v \
            $src/qact_row_scaled_serial.v $src/qact_row_stream_wrapper.v \
            $src/tb_qact_row_stream.sv
          vvp /tmp/qact-stream.vvp +folder=qact-stream-fixtures | tee qact-stream.log
          grep -q '^PASS_QACT_STREAM rows=32 inputs=2048 outputs=2304 stalls=' qact-stream.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qact-narrow-stream-rtl
          path: |
            qact-stream-reference.log
            qact-stream-fixtures/manifest.json
            qact-stream.log
          if-no-files-found: warn
